<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>7lbsaa Player | مشغل الحوت الاحترافي</title>
    <!-- استدعاء مكتبة الأيقونات الاحترافية Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c1b, #201a30, #0f0c1b);
            --panel-bg: rgba(255, 255, 255, 0.06);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --accent-color: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.4);
            --control-btn-bg: rgba(255, 255, 255, 0.1);
            --control-btn-hover: rgba(255, 255, 255, 0.2);
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #f5f7fa, #e4e8f0, #f5f7fa);
            --panel-bg: rgba(255, 255, 255, 0.65);
            --panel-border: rgba(0, 0, 0, 0.08);
            --text-main: #1a1a2e;
            --text-sub: #555566;
            --accent-color: #0072ff;
            --accent-glow: rgba(0, 114, 255, 0.3);
            --control-btn-bg: rgba(0, 0, 0, 0.05);
            --control-btn-hover: rgba(0, 0, 0, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        .theme-toggle-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .theme-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px var(--shadow-color);
        }

        .theme-btn:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .video-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.5;
            max-width: 85%;
            background: linear-gradient(45deg, var(--text-main), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px var(--shadow-color);
        }

        .player-container {
            position: relative;
            width: 90%;
            max-width: 880px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 70px var(--shadow-color);
            border: 1px solid var(--panel-border);
        }

        .player-container.hide-controls {
            cursor: none;
        }

        .iframe-wrapper {
            position: absolute;
            top: -12%; 
            left: 0;
            width: 100%;
            height: 124%;
            pointer-events: none;
        }

        #youtube-player {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.001);
            z-index: 10;
            cursor: pointer;
        }

        .custom-poster-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .custom-poster-cover.video-started {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .play-image-trigger {
            width: 90px;
            height: 90px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .custom-poster-cover:hover .play-image-trigger {
            transform: scale(1.12);
            filter: drop-shadow(0 0 15px var(--accent-glow)) drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 20;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
            transform: translateY(0);
        }

        .player-container.hide-controls .custom-controls {
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
        }

        .controls-right, .controls-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* حاوية الصوت الذكية (يظهر المؤشر عند الاقتراب أو اللمس) */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 5px;
            position: relative;
        }

        .volume-slider-wrapper {
            width: 0px;
            overflow: hidden;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            height: 20px;
            direction: ltr !important;
        }

        .volume-container:hover .volume-slider-wrapper,
        .volume-container:focus-within .volume-slider-wrapper,
        .volume-container.active .volume-slider-wrapper {
            width: 70px;
            margin-left: 5px;
        }

        .volume-slider {
            width: 100%;
            height: 5px;
            background: var(--control-btn-bg);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
        }

        .volume-filled {
            height: 100%;
            background: var(--accent-color);
            width: 100%;
            border-radius: 5px;
        }

        .control-btn {
            background: var(--control-btn-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            font-size: 15px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .progress-container {
            flex-grow: 1;
            margin: 0 15px;
            display: flex;
            align-items: center;
            position: relative;
            cursor: pointer;
            height: 20px;
            direction: ltr !important;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--control-btn-bg);
            border-radius: 10px;
            position: relative;
            transition: height 0.2s ease;
        }

        .progress-container:hover .progress-bar {
            height: 8px;
        }

        .progress-filled {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #00f2fe);
            width: 0%;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .progress-filled::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 12px;
            height: 12px;
            background: var(--text-main);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }

        .progress-container:hover .progress-filled::after {
            transform: translateY(-50%) scale(1);
        }

        /* تنسيق القوائم المنبثقة للجودة والسرعة داخل أزرار التحكم */
        .dropdown-menu-panel {
            position: absolute;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 12, 27, 0.95);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            display: none;
            flex-direction: column;
            padding: 6px;
            z-index: 100;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            min-width: 90px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .dropdown-menu-panel button {
            background: none;
            border: none;
            color: #fff;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            border-radius: 6px;
            font-family: inherit;
            white-space: nowrap;
            transition: background 0.2s ease;
        }

        .dropdown-menu-panel button:hover {
            background: var(--accent-color);
            color: #000;
            font-weight: 600;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="theme-toggle-container">
    <button class="theme-btn" id="mode-switcher-btn">
        <span id="theme-icon">☀️</span> <span id="theme-text">الوضع الساطع</span>
    </button>
</div>

<div class="video-title">أغنية تخرج دفعة 2019 طب قصر العيني جامعة القاهرة</div>

<div class="player-container" id="main-player-container">
    
    <!-- بوستر تشغيل الفيديو المخصص قبل البدء -->
    <div class="custom-poster-cover" id="custom-poster">
        <img src="play.png" alt="Play" class="play-image-trigger" id="img-start-trigger" />
    </div>

    <!-- طبقة الحماية الشفافة فوق الفيديو لمنع التفاعل المباشر مع يوتيوب ولتلقي النقرات -->
    <div class="video-overlay" id="vid-mask"></div>
    
    <div class="iframe-wrapper">
        <div id="youtube-player"></div>
    </div>
    
    <!-- شريط التحكم الاحترافي السفلي -->
    <div class="custom-controls" id="controls-panel">
        <div class="controls-right">
            <!-- زر التشغيل والإيقاف المؤقت -->
            <button class="control-btn" id="play-pause-btn"><i class="fas fa-play"></i></button>
            
            <!-- حاوية الصوت المتمددة سحابياً -->
            <div class="volume-container" id="vol-zone">
                <button class="control-btn" id="mute-btn"><i class="fas fa-volume-up"></i></button>
                <div class="volume-slider-wrapper">
                    <div class="volume-slider" id="volume-timeline">
                        <div class="volume-filled" id="volume-current"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- خط التقدم الزمني لمشاهدة الفيديو -->
        <div class="progress-container" id="progress-timeline">
            <div class="progress-bar">
                <div class="progress-filled" id="progress-current"></div>
            </div>
        </div>
        
        <!-- سيتم حقن أزرار الجودة وسرعة التشغيل هنا برمجياً بجانب زر ملء الشاشة -->
        <div class="controls-left">
            <button class="control-btn" id="fullscreen-btn"><i class="fas fa-expand"></i></button>
        </div>
    </div>
</div>

<!-- استدعاء ملفات الـ API والجافا سكريبت الخارجية والداخلية المحدثة -->
<script src="https://www.youtube.com/iframe_api"></script>
<script src="secure-player.js"></script>

</body>
</html>
